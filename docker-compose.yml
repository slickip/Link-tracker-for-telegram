version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: link-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      BOT_DB: bot_db
      SCRAPPER_DB: scrapper_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init-multiple-db.sh:/docker-entrypoint-initdb.d/init-multiple-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate-scrapper:
    image: migrate/migrate:4
    container_name: migrate-scrapper
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations/scrapper:/migrations:ro
    command:
      [
        "-path=/migrations",
        "-database=postgres://postgres:postgres@postgres:5432/scrapper_db?sslmode=disable",
        "up"
      ]

  migrate-bot:
    image: migrate/migrate:4
    container_name: migrate-bot
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations/bot:/migrations:ro
    command:
      [
        "-path=/migrations",
        "-database=postgres://postgres:postgres@postgres:5432/bot_db?sslmode=disable",
        "up"
      ]

  scrapper:
    build:
      context: .
      dockerfile: ./scrapper/Dockerfile
    container_name: scrapper
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate-scrapper:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/scrapper_db?sslmode=disable
      ACCESS_TYPE: SQL
      SCRAPPER_HTTP_ADDR: :8081
      SCRAPPER_GRPC_ADDR: :8083
      BOT_HTTP_URL: http://bot:8080
      BOT_GRPC_ADDR: bot:8082
    ports:
      - "8081:8081"
      - "8083:8083"

  bot:
    build:
      context: .
      dockerfile: ./bot/Dockerfile
    container_name: bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate-bot:
        condition: service_completed_successfully
      scrapper:
        condition: service_started
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      SCRAPPER_URL: http://scrapper:8081
      SCRAPPER_GRPC_ADDR: scrapper:8083
      BOT_HTTP_ADDR: :8080
      BOT_GRPC_ADDR: :8082
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/bot_db?sslmode=disable
      ACCESS_TYPE: SQL
    ports:
      - "8080:8080"
      - "8082:8082"

volumes:
  postgres_data: