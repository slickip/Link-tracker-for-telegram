version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: link-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      BOT_DB: bot_db
      SCRAPPER_DB: scrapper_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init-multiple-db.sh:/docker-entrypoint-initdb.d/init-multiple-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate-scrapper:
    image: migrate/migrate:4
    container_name: migrate-scrapper
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations/scrapper:/migrations:ro
    command:
      [
        "-path=/migrations",
        "-database=postgres://postgres:postgres@postgres:5432/scrapper_db?sslmode=disable",
        "up"
      ]

  migrate-bot:
    image: migrate/migrate:4
    container_name: migrate-bot
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations/bot:/migrations:ro
    command:
      [
        "-path=/migrations",
        "-database=postgres://postgres:postgres@postgres:5432/bot_db?sslmode=disable",
        "up"
      ]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: link-tracker-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log

  kafka1:
    image: confluentinc/cp-kafka:7.6.1
    container_name: link-tracker-kafka1
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "19092:19092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092,PLAINTEXT_HOST://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka1_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka2:
    image: confluentinc/cp-kafka:7.6.1
    container_name: link-tracker-kafka2
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "19093:19093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:19093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9092,PLAINTEXT_HOST://localhost:19093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka2_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka3:
    image: confluentinc/cp-kafka:7.6.1
    container_name: link-tracker-kafka3
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "19094:19094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:19094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9092,PLAINTEXT_HOST://localhost:19094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka3_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-init-topics:
    image: confluentinc/cp-kafka:7.6.1
    container_name: link-tracker-kafka-init-topics
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -lc
      - |
        set -e

        echo "Waiting for Kafka..."
        until kafka-topics --bootstrap-server kafka1:9092,kafka2:9092,kafka3:9092 --list >/dev/null 2>&1; do
          echo "Kafka is not ready yet..."
          sleep 2
        done

        echo "Creating topic link-updates..."
        kafka-topics --bootstrap-server kafka1:9092,kafka2:9092,kafka3:9092 --create --if-not-exists --topic link-updates --partitions 3 --replication-factor 3 --config min.insync.replicas=2

        echo "Creating topic link-updates-dlq..."
        kafka-topics --bootstrap-server kafka1:9092,kafka2:9092,kafka3:9092 --create --if-not-exists --topic link-updates-dlq --partitions 3 --replication-factor 3 --config min.insync.replicas=2 --config retention.ms=2592000000

        echo "Kafka topics:"
        kafka-topics --bootstrap-server kafka1:9092,kafka2:9092,kafka3:9092 --list

        echo "Topic link-updates description:"
        kafka-topics --bootstrap-server kafka1:9092,kafka2:9092,kafka3:9092 --describe --topic link-updates

        echo "Topic link-updates-dlq description:"
        kafka-topics --bootstrap-server kafka1:9092,kafka2:9092,kafka3:9092 --describe --topic link-updates-dlq

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: link-tracker-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:9092,kafka2:9092,kafka3:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081

  scrapper:
    build:
      context: .
      dockerfile: ./scrapper/Dockerfile
    container_name: scrapper
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate-scrapper:
        condition: service_completed_successfully
      kafka-init-topics:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
      valkey-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/scrapper_db?sslmode=disable
      ACCESS_TYPE: SQL

      SCRAPPER_HTTP_ADDR: :8081
      SCRAPPER_GRPC_ADDR: :8083

      BOT_HTTP_URL: http://bot:8080
      BOT_GRPC_ADDR: bot:8082

      NOTIFICATION_TRANSPORT: KAFKA
      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092
      KAFKA_LINK_UPDATES_TOPIC: link-updates
      KAFKA_CLIENT_ID: scrapper
      OUTBOX_ENABLED: true
      OUTBOX_PUBLISH_INTERVAL: 5s
      OUTBOX_BATCH_SIZE: 100
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KAFKA_LINK_UPDATES_SUBJECT: link-updates-value
      KAFKA_SERIALIZATION_FORMAT: AVRO
      VALKEY_ENABLED: "${VALKEY_ENABLED:-true}"
      VALKEY_ADDRESSES: "valkey-node-1:6379,valkey-node-2:6379,valkey-node-3:6379"
      VALKEY_USERNAME: ""
      VALKEY_PASSWORD: ""
      VALKEY_TTL: "${VALKEY_TTL:-5m}"
      VALKEY_CLIENT_SIDE_CACHE_ENABLED: "${VALKEY_CLIENT_SIDE_CACHE_ENABLED:-false}"
      VALKEY_CLIENT_SIDE_CACHE_TTL: "${VALKEY_CLIENT_SIDE_CACHE_TTL:-30s}"
    ports:
      - "8081:8081"
      - "8083:8083"
      - "8012:8012"

  bot:
    build:
      context: .
      dockerfile: ./bot/Dockerfile
    container_name: bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate-bot:
        condition: service_completed_successfully
      kafka-init-topics:
        condition: service_completed_successfully
      scrapper:
        condition: service_started
      schema-registry:
        condition: service_healthy
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}

      SCRAPPER_URL: http://scrapper:8081
      SCRAPPER_GRPC_ADDR: scrapper:8083

      BOT_HTTP_ADDR: :8080
      BOT_GRPC_ADDR: :8082

      DATABASE_URL: postgres://postgres:postgres@postgres:5432/bot_db?sslmode=disable
      ACCESS_TYPE: SQL

      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092
      KAFKA_LINK_UPDATES_TOPIC: link-updates
      KAFKA_CONSUMER_GROUP: bot-link-updates
      KAFKA_CLIENT_ID: bot
      KAFKA_DLQ_TOPIC: link-updates-dlq
      KAFKA_MAX_RETRIES: 3
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KAFKA_LINK_UPDATES_SUBJECT: link-updates-value
      KAFKA_SERIALIZATION_FORMAT: AVRO
    ports:
      - "8080:8080"
      - "8082:8082"
      - "8011:8011"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: link-tracker-schema-registry
    restart: unless-stopped
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    ports:
      - "18085:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka1:9092,PLAINTEXT://kafka2:9092,PLAINTEXT://kafka3:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/subjects || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
      
  valkey-node-1:
    image: valkey/valkey:8.1-alpine
    container_name: link-tracker-valkey-node-1
    restart: unless-stopped
    command:
      [
        "valkey-server",
        "--port", "6379",
        "--cluster-enabled", "yes",
        "--cluster-config-file", "nodes.conf",
        "--cluster-node-timeout", "5000",
        "--appendonly", "yes",
        "--protected-mode", "no"
      ]
    ports:
      - "6379:6379"
    volumes:
      - valkey_node_1_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey-node-2:
    image: valkey/valkey:8.1-alpine
    container_name: link-tracker-valkey-node-2
    restart: unless-stopped
    command:
      [
        "valkey-server",
        "--port", "6379",
        "--cluster-enabled", "yes",
        "--cluster-config-file", "nodes.conf",
        "--cluster-node-timeout", "5000",
        "--appendonly", "yes",
        "--protected-mode", "no"
      ]
    ports:
      - "6380:6379"
    volumes:
      - valkey_node_2_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey-node-3:
    image: valkey/valkey:8.1-alpine
    container_name: link-tracker-valkey-node-3
    restart: unless-stopped
    command:
      [
        "valkey-server",
        "--port", "6379",
        "--cluster-enabled", "yes",
        "--cluster-config-file", "nodes.conf",
        "--cluster-node-timeout", "5000",
        "--appendonly", "yes",
        "--protected-mode", "no"
      ]
    ports:
      - "6381:6379"
    volumes:
      - valkey_node_3_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey-init:
    image: valkey/valkey:8.1-alpine
    container_name: link-tracker-valkey-init
    depends_on:
      valkey-node-1:
        condition: service_healthy
      valkey-node-2:
        condition: service_healthy
      valkey-node-3:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e

        echo "Waiting for Valkey nodes..."

        until valkey-cli -h valkey-node-1 -p 6379 ping >/dev/null 2>&1; do sleep 1; done
        until valkey-cli -h valkey-node-2 -p 6379 ping >/dev/null 2>&1; do sleep 1; done
        until valkey-cli -h valkey-node-3 -p 6379 ping >/dev/null 2>&1; do sleep 1; done

        if valkey-cli -h valkey-node-1 -p 6379 cluster info 2>/dev/null | grep -q "cluster_state:ok"; then
          echo "Valkey cluster already initialized"
          exit 0
        fi

        echo "Creating Valkey cluster..."

        valkey-cli --cluster create \
          valkey-node-1:6379 \
          valkey-node-2:6379 \
          valkey-node-3:6379 \
          --cluster-replicas 0 \
          --cluster-yes

        echo "Valkey cluster created"


  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: link-tracker-prometheus
    restart: unless-stopped
    depends_on:
      - bot
      - scrapper
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana-oss:11.1.0
    container_name: link-tracker-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
volumes:
  postgres_data:
  zookeeper_data:
  zookeeper_log:
  kafka1_data:
  kafka2_data:
  kafka3_data:
  valkey_node_1_data:
  valkey_node_2_data:
  valkey_node_3_data:
  prometheus_data:
  grafana_data: